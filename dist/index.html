<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233f">
  <meta name="description" content="Preparação intensiva de dois dias para o Processo Seletivo SESI-RS.">
  <title>Intensivo para SESI-RS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="socio.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="Ir ao início"><span class="brand-mark">I</span><span><b>INTENSIVO PARA SESI-RS</b><small>Prova · 27/09/2026</small></span></button>
    
    <div class="topbar-actions">
      <div id="authContainer" class="auth-box">
        <button id="loginBtn" class="btn-google" aria-label="Entrar com o Google">
          <svg class="google-icon" viewBox="0 0 24 24" width="16" height="16">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Entrar</span>
        </button>
        <div id="userProfile" class="user-profile hidden">
          <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
          <span id="userName" class="user-name"></span>
          <span id="syncStatus" class="sync-badge" title="Progresso salvo na nuvem">☁️</span>
          <button id="logoutBtn" class="btn-logout" title="Sair da conta">Sair</button>
        </div>
      </div>
      <button class="menu" id="menuBtn" aria-label="Abrir menu">☰</button>
    </div>

    <nav id="nav">
      <button data-go="home">Início</button><button data-go="trail">Trilha</button><button data-go="practice">Praticar</button><button data-go="essay">Redação</button><button data-go="errors">Meus erros</button><button data-go="progress">Progresso</button>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer><span>v1.4.2</span><span>Developed by AK Labs</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="firebase-config.js?v=1.4.2"></script>
  <script src="app.js?v=1.4.2"></script>
  <script src="socio.js?v=1.4.2"></script>
  <script src="auth.js?v=1.4.2"></script>
</body>
</html>
